services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-quiz_pass}
      MYSQL_USER: ${MYSQL_USER:-quiz}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-quiz_pass_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-quiz_pass_root_password}
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-./.env.docker.example}
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-quiz}:${MYSQL_PASSWORD:-quiz_pass_password}@mysql:3306/${MYSQL_DATABASE:-quiz_pass}
      REDIS_URL: redis://redis:6379/0
      AI_WORKFLOW_EXECUTION_MODE: rq
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-./.env.docker.example}
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-quiz}:${MYSQL_PASSWORD:-quiz_pass_password}@mysql:3306/${MYSQL_DATABASE:-quiz_pass}
      REDIS_URL: redis://redis:6379/0
      AI_WORKFLOW_EXECUTION_MODE: rq
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: ["python", "-m", "app.workers.ai_generation_worker"]

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
