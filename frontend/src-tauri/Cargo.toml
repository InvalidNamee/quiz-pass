[package]
name = "quiz-pass"
version = "0.1.0"
description = "Quiz Pass desktop client"
authors = ["Quiz Pass"]
edition = "2021"

[lib]
name = "quiz_pass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
